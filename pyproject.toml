[project]
name = "simplecut"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "moviepy>=2.2.1",
    "pillow>=11.3.0",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.7",
]

[tool.ruff.lint]
# E : erreurs pycodestyle (dont E402, import hors du haut de fichier)
# F : pyflakes (imports et variables morts)
# I : ordre des imports
select = ["E", "F", "I"]
# E501 (longueur de ligne) : laissée au formateur, pas au linter.
ignore = ["E501"]
